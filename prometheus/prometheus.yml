global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'fastapi'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['app:8000']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Custom Memory Engine HTTP host (`core/memory-engine/src/custom_memory_engine/host/app.py`).
  # Host binds 127.0.0.1:8100 by default; update target to your host service address when deployed via Docker/systemd.
  - job_name: 'core/memory-engine'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['host.docker.internal:8100']
