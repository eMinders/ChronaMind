name: App image

# Builds the root application image and imports the app inside it, whenever something that goes into the image
# changes. Not a required check (so the path filter is safe): it catches a broken Dockerfile, lock or entrypoint
# before deploy.yaml is ever dispatched.

on:
  pull_request:
    paths: &image-paths
      - Dockerfile
      - .dockerignore
      - .python-version
      - pyproject.toml
      - uv.lock
      - app/**
      - alembic/**
      - alembic.ini
      - scripts/docker-entrypoint.sh
      - .github/workflows/app-image.yaml
  push:
    branches: [main]
    paths: *image-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: docker build
        run: docker build --tag chronamind-app:ci .
      - name: Import the app inside the image (no services)
        run: >-
          docker run --rm --entrypoint python -e APP_ENV=test -e JWT_SECRET_KEY="$(openssl rand -hex 32)"
          chronamind-app:ci -c "from app.main import app; assert '/api/v1/auth/login' in app.openapi()['paths']"
      - name: Image runs as the unprivileged user and cannot modify its code
        run: |
          test "$(docker run --rm --entrypoint id chronamind-app:ci -un)" = appuser
          ! docker run --rm --entrypoint touch chronamind-app:ci /app/app/probe
      - name: Image size
        run: docker image ls chronamind-app:ci --format '{{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"
