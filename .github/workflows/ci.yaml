name: CI

# Root application (apps/api/app/, apps/api/evals/): lint, format, type check and its own tests; plus actionlint over every workflow
# file. All three jobs are required checks, so they run on every PR (no path filter: a skipped workflow never
# reports). core/memory-engine/ is excluded from the root Ruff config and verified by its own workflow.
# `app-engine-boundary` drives the app's memory client and the /api/v1/memory routes against the engine's real host and
# PostgreSQL: the one place the two projects are tested together (tests/integration/test_app_engine_boundary.py and
# tests/integration/test_memory_router_live.py).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
          cache-dependency-glob: apps/api/uv.lock  # the API workspace lock only (Python comes from .python-version)
      - name: uv sync --locked
        run: uv sync --locked --all-extras --all-groups --project apps/api
      - name: ruff check
        run: cd apps/api && uv run --no-sync ruff check .
      - name: ruff format --check
        run: cd apps/api && uv run --no-sync ruff format --check .
      - name: pyright
        run: cd apps/api && uv run --no-sync pyright
      - name: pytest (API workspace; no services needed)
        run: cd apps/api && uv run --no-sync pytest -q

  app-engine-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: cme_test
          POSTGRES_PASSWORD: isolated_ci_only  # pragma: allowlist secret (disposable service container)
          POSTGRES_DB: cme_compatibility
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U cme_test -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CME_TEST_DATABASE_URL: postgresql://cme_test:isolated_ci_only@localhost:5433/cme_compatibility  # pragma: allowlist secret
      PGPASSWORD: isolated_ci_only  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
          # both interpreters' locks: the app's (3.14, root) and the engine's (3.12, core/memory-engine/)
          cache-dependency-glob: |
            apps/api/uv.lock
            core/memory-engine/uv.lock
      - name: uv sync --locked (API workspace)
        run: uv sync --locked --all-extras --all-groups --project apps/api
      - name: uv sync --locked --extra host (engine interpreter, core/memory-engine/.venv)
        working-directory: core/memory-engine
        run: uv sync --locked --extra host
      - name: Prepare database extensions (in public, as the engine's migrations expect)
        run: >-
          psql -h localhost -p 5433 -U cme_test -d cme_compatibility -v ON_ERROR_STOP=1
          -c "CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public"
          -c "CREATE EXTENSION IF NOT EXISTS btree_gist WITH SCHEMA public"
          -c "CREATE EXTENSION IF NOT EXISTS pg_trgm WITH SCHEMA public"
      - name: pytest (app-to-engine boundary and the memory inspector routes; a skip is a failure here)
        # Both modules skip without the engine interpreter or the database. Both are provided above, so a skip means the
        # job silently tested nothing: the step fails on it instead of reporting success. The second module drives the
        # /api/v1/memory routes against the real host with both delegating tokens (Tier B agent, Tier C inspector).
        run: |
          cd apps/api && uv run --no-sync pytest -q -rs -m integration \
            tests/integration/test_app_engine_boundary.py \
            tests/integration/test_memory_router_live.py | tee /tmp/boundary.txt
          if grep -qiE "[0-9]+ skipped" /tmp/boundary.txt; then echo "a boundary test skipped"; exit 1; fi

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (every workflow and composite action reference)
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667  # 1.7.12
          -color
