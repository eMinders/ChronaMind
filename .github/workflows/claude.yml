name: Claude Code

# Two on-demand jobs, with two different trigger phrases, because they are two different agents:
#
#   @chronamind …        the interactive assistant: answers in an issue or PR, and can implement a change on a branch.
#   @claude review       the reviewer: runs the same `.claude/skills/review-pr/SKILL.md` procedure as the automatic
#                        review, on demand — for a draft, a fork PR, a PR the automatic run skipped, or a full re-pass.
#
# The phrases are distinct on purpose. Claude Code Review (the managed service) also reacts to `@claude review`, and one
# comment must never start two agents. The action matches a trigger phrase on word boundaries, so `@chronamind` does not
# fire on `@claude`, and the review job's `startsWith` guard keeps the assistant out of a review request.
#
# Every job is limited to an owner, member or collaborator: the author-association guard is defence in depth on top of
# the action's own write-permission check, so no fork and no bot can spend the subscription.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  # A run must be cancelled by a *superseding request*, never by the bot's own work. The action posts an
  # acknowledgement comment as it starts; that comment is an `issue_comment` event like any other, so it used to join
  # this group and cancel the run that had just posted it — `claude` job "Claude Code is working…" at 10:07:11Z, run
  # cancelled at 10:07:27Z, on #233. A run started by the bot therefore gets a group of its own (it is skipped by the
  # job's `if` anyway), and only a human's comment can supersede a human's request.
  group: >-
    ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}-${{
      contains(fromJSON('["claude[bot]","github-actions[bot]"]'), github.actor) && format('bot-{0}', github.run_id) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '@claude review') && 'review' || 'assist')
    }}
  cancel-in-progress: true

jobs:
  claude:
    # `@chronamind` only. A comment that asks for a review is handled by the `review` job, never by both.
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association || github.event.review.author_association) &&
      !(github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '@claude review')) &&
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@chronamind') ||
       github.event_name != 'pull_request_review' && contains(github.event.comment.body, '@chronamind'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        # The action restores `CLAUDE.md`, `AGENTS.md`, `.claude/` and `.mcp.json` from the base branch on pull-request
        # events, so a pull request cannot change the instructions this job follows.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1.0.284
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@chronamind"
          # Claude may commit to its own branch or the pull request's branch, but never merge, approve or push over
          # `main` (which is protected anyway). It opens no pull request: it replies with the creation link for a human.
          claude_args: |
            --permission-mode auto
            --disallowedTools "Bash(gh pr merge:*),Bash(gh pr review:*),Bash(git push:*),Bash(gh api -X PUT:*),Bash(gh api --method PUT:*)"
          additional_permissions: |
            actions: read

  review:
    # `@claude review` on a pull request: one full review, now, through the repository's own procedure.
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, '@claude review')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Same single elevated grant as the automatic review, for the same one mutation (`resolveReviewThread` requires
    # Contents: write); see `.github/workflows/claude-code-review.yml` for the compensating controls.
    permissions:
      contents: write
      pull-requests: read
      issues: read
      id-token: write
    env:
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Resolve the pull request's base branch and head commit
        # An `issue_comment` payload carries no base ref, so it is read from the API once and exported for the steps
        # below. Nothing here comes from the comment's text: the PR number is the issue number GitHub reported.
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '"base_ref=" + .base.ref,
            "base_sha=" + .base.sha, "head_sha=" + .head.sha, "head_repo=" + .head.repo.full_name' >> "$GITHUB_OUTPUT"

      - name: Checkout the base branch (the standard, and the repo the action expects)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.base_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout the pull request beside it (the code under review)
        # The base ref is the working tree, because a comment does not name a trusted ref; the pull request goes only
        # into `pr-head` (docs/security.md, "Which files come from the base branch on pull requests"). A fork works
        # here, because a maintainer asked for the review explicitly, so the head is read from the repository the pull
        # request actually came from rather than assumed to be this one.
        #
        # This used to be three `git` lines beginning with `git init pr-head`, which creates a repository with no
        # remote — so `git fetch origin` failed with exit 128 and the job died before the review: it had never once
        # run (the first attempt, #233 at 10:27Z, failed exactly there). `actions/checkout` is what the automatic
        # review uses, and it authenticates the fetch itself.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.head_sha }}
          path: pr-head
          fetch-depth: 0
          persist-credentials: false

      - name: Decide the tier from the pull request's history
        # An `issue_comment` payload carries no tier, so the on-demand review used to infer one — and on #238 it called
        # itself a first review on a pull request that already had three. The gate answers the same question here as it
        # does for an automatic run, from the review history, before the model is paid for. It never skips this path:
        # a maintainer asked for a review, so `review` is ignored and only the tier and the previous shas are used.
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          ACTION: issue_comment
        run: |
          if [ -f .github/scripts/review_gate.py ]; then
            python3 .github/scripts/review_gate.py
          else
            printf 'tier=unknown\nreason=gate_failed\nprevious_head_sha=\nprevious_base_sha=\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Run the review
        id: claude-review
        uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1.0.284
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: >-
            /review-pr
            PR_NUMBER=${{ github.event.issue.number }}
            REPOSITORY=${{ github.repository }}
            BASE_REF=${{ steps.pr.outputs.base_ref }}
            BASE_SHA=${{ steps.pr.outputs.base_sha }}
            HEAD_SHA=${{ steps.pr.outputs.head_sha }}
            REVIEW_TIER=${{ steps.gate.outputs.tier }}
            REVIEW_REASON=${{ steps.gate.outputs.reason }}
            PREVIOUS_BASE_SHA=${{ steps.gate.outputs.previous_base_sha }}
            PREVIOUS_HEAD_SHA=${{ steps.gate.outputs.previous_head_sha }}
            The base branch is checked out at the workspace root and the pull request at ./pr-head.
            REPOSITORY is the canonical owner/name: every repository URL you write comes from it.
            This is a full review requested by a maintainer: cover the whole pull request, not only its last commit.
            REVIEW_TIER was decided from this pull request's history before you ran; follow it.
          claude_args: |
            --permission-mode default
            --model ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-sonnet-5-5' }}
            --add-dir pr-head
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh api:*),Bash(gh issue view:*),Bash(gh search:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git grep:*),Bash(git show-ref:*),Bash(git fetch:*)"
            --disallowedTools "Edit,Write,NotebookEdit,mcp__github_file_ops,Bash(git push:*),Bash(git commit:*),Bash(git merge:*),Bash(gh pr merge:*),Bash(gh pr close:*),Bash(gh pr review:*),Bash(gh pr edit:*),Bash(gh api -X:*),Bash(gh api --method:*)"

      - name: Resolve the threads this review verified
        # Same seam as the automatic review: the reviewer names the threads it verified in its summary, and the job's
        # own token (which holds Contents: write) performs the mutation after checking authorship.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          SINCE: ${{ github.event.comment.created_at }}
        run: |
          if [ -f .github/scripts/resolve_threads.py ]; then
            python3 .github/scripts/resolve_threads.py
          else
            echo "resolve: no .github/scripts/resolve_threads.py on the base branch"
          fi
