name: Build and push to Docker Hub

# Manual only. Until 2026-10-31 this workflow triggered on `master`, a branch that does not exist,
# so it never ran (0 runs in the Actions history). Enabling automatic image publication on `main`
# is a deployment decision for the Project Owner; until then it runs only when dispatched.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push to Docker Hub
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      REPOSITORY_NAME: ${{ github.event.repository.name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sanitize repository name
        run: |
          repo_name=$(printf '%s' "$REPOSITORY_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
          echo "REPO_NAME=${repo_name}" >> "$GITHUB_ENV"

      - name: Build image
        run: make docker-build ENV=production

      - name: Log in to Docker Hub
        if: env.DOCKER_USERNAME != ''
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: printf '%s' "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin

      - name: Push image
        if: env.DOCKER_USERNAME != ''
        run: |
          docker tag fastapi-langgraph-template:production "$DOCKER_USERNAME/$REPO_NAME:production"
          docker push "$DOCKER_USERNAME/$REPO_NAME:production"
