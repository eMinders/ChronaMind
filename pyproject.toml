[project]
name = "langgraph-fastapi-template"
version = "0.1.0"
description = "LangGraph FastAPI Template"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asgi-correlation-id>=5.0.1",
    "bcrypt>=5.0.0",
    "colorama>=0.4.6",
    "ddgs>=9.16.1",
    "fastapi>=0.162.0",
    # Not imported by app/, but langfuse.langchain (the tracing CallbackHandler) refuses to load without it.
    "langchain>=1.4.9",
    "langchain-core>=1.7.6",
    "langchain-openai>=1.7.4",
    # <5: Langfuse 5 removed public trace listing (api.trace.list), which evals/ is built on.
    "langfuse>=4.18.0,<5",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mem0ai>=2.2.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic[email]>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "slowapi>=0.1.10",
    # The app's database layer is async (create_async_engine); SQLAlchemy's asyncio support needs greenlet.
    "sqlalchemy[asyncio]>=2.1.8",
    "sqlmodel>=0.0.48",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "tiktoken>=0.12.0",
    "tqdm>=4.70.1",
    "uvicorn>=0.54.0",
    "uvloop>=0.23.0; platform_system != 'Windows'",
]

[project.optional-dependencies]
# Optional request profiling (app/core/middleware.py imports it only when installed).
profiling = ["pyinstrument>=5.1.3"]
# Optional Valkey/Redis-backed cache and rate-limit storage (app/core/cache.py, app/core/limiter.py).
cache = ["redis>=8.1.0", "valkey[libvalkey]>=6.2.0"]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "ruff>=0.17.4",
]
test = ["httpx>=0.28.1", "pytest>=9.2.0"]

[tool.uv]
# `uv sync` (make install, scripts/setup.py) installs both groups, so `make check` runs the project's own pytest
# locally; without `test` here `uv run pytest` silently falls back to any pytest on PATH (wrong interpreter).
# CI syncs --all-groups and the Dockerfile --no-default-groups, so neither changes.
default-groups = ["dev", "test"]


[tool.pytest.ini_options]
# The root application's own tests. custom-memory-engine/ is a separate project with its own suite and CI job.
testpaths = ["tests"]
# Warnings raised by this code base fail the run; third-party deprecations (e.g. langsmith on 3.14) are reported only.
filterwarnings = ["error:::app", "error:::tests"]

[tool.ruff]
line-length = 119
exclude = ["migrations", "*.ipynb", "venv", ".venv", ".agents", ".cursor", ".claude"]
# custom-memory-engine/ is linted and formatted by its own pinned Ruff in its own CI job (static); linting it here too
# ran two Ruff versions over the same files. Ruff 0.17 also formats code blocks in Markdown: docs are prose, so not here.
extend-exclude = ["custom-memory-engine", "*.md"]

[tool.ruff.lint]
# Enable flake8-bugbear (`B`) rules and docstring (`D`) rules
select = ["E", "F", "B", "ERA", "D"]
# Never enforce `E501` (line length violations).
ignore = ["E501", "D203", "D213", "B904", "B008"]
# Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Ignore `E402` (import violations) in all `__init__.py` files
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
# Test names are full sentences; a docstring would repeat them.
"tests/**" = ["D103", "D104"]

[tool.pyright]
include = ["app", "evals"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "alembic/versions",
    "migrations",
    "venv",
]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

# Tightened from defaults — cheap real-bug catchers
reportDuplicateImport = "error"
reportInvalidTypeVarUse = "error"
reportSelfClsParameterName = "error"

# Style nudges
reportImplicitOverride = "warning"
