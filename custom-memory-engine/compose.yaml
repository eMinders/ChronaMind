# Disposable compatibility database only; not a production deployment.
services:
  db:
    image: pgvector/pgvector:0.8.7-pg16-bookworm@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_DB: cme_compatibility
      POSTGRES_USER: cme_test
      POSTGRES_PASSWORD: ${CME_TEST_DB_PASSWORD:?Set a strong disposable test password}
    ports:
      - "127.0.0.1:${CME_TEST_DB_PORT:-5433}:5432"
    volumes:
      - ./tests/init_extensions.sql:/docker-entrypoint-initdb.d/001_extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cme_test -d cme_compatibility"]
      interval: 2s
      timeout: 3s
      retries: 30
