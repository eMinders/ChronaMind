# A production-shaped worker deployment beside an existing database (V2-D103).
#
# This is *not* the compatibility stack: `../compose.yaml` is the disposable test database and says so. This file runs the
# slow lane against a database the operator already has, with the model cache as a volume and a health check that reads
# the queue.
#
#   docker compose -f deploy/compose.worker.yaml --env-file /etc/chronamind/worker.env up -d
#
# `restart: unless-stopped` is the container equivalent of the systemd unit's `Restart=always`; `stop_grace_period`
# outlives one extraction so a `docker compose down` stops the loop instead of killing a job mid-call.
services:
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    image: chronamind/worker:dev
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - ${WORKER_ENV_FILE:-/etc/chronamind/worker.env}
    volumes:
      # The embedding model, read-only: the image must not carry weights, and a rebuild must not change the model under a
      # running deployment.
      - ${CME_MODEL_CACHE:-../.model-cache}:/models:ro
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "scripts/worker_healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    # One worker per tenant set is enough for this lane; a second one is safe (the queue is SKIP LOCKED) and is how a
    # deployment scales, so it is left to the operator to replicate rather than inferred here.
    deploy:
      replicas: 1
