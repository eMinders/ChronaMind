[project]
name = "chronamind-custom-memory-engine"
version = "0.1.0"
description = "Independent Custom Memory Engine decision contracts and compatibility verification"
requires-python = ">=3.12,<3.13"
dependencies = [
  "psycopg[binary,pool]==3.3.8",
  "pgvector==0.5.1",
  "pydantic==2.14.3",
  "tenacity==9.2.1",
  "structlog==26.1.0",
  "rich==15.0.0",
  "numpy==2.5.4",
  "scipy==1.18.1",
  "ijson==3.6.0",
  "regex==2026.9.29",
]

[project.optional-dependencies]
baselines = [
  "tiktoken==0.14.0",
  "onnxruntime==1.31.0",
  "tokenizers==0.23.3",
  "mem0ai==2.2.1",
  "graphiti-core[falkordb]==0.31.2",
  "qdrant-client==1.20.0",
  "openai==2.7.1",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "pytest-xdist==3.8.0",
  "ruff==0.17.4",
  "pyright==1.1.414",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/custom_memory_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]
testpaths = [
  "tests",
  "evaluation/harness/tests",
  "research/benchmarks/longmemeval/tests",
  "research/benchmarks/locomo/tests",
  "research/benchmarks/tests",
  "evaluation/baselines/tests",
  "evaluation/judge/tests",
  "evaluation/stats/tests",
]
markers = ["integration: requires a disposable PostgreSQL database"]
# With `-n` (pytest-xdist), idle workers steal queued tests: per-test isolation (a private database clone per DB
# test, tests/integration/schema.py) makes any test runnable on any worker, so no module pins one worker.
addopts = ["--dist=worksteal"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 119
# Ruff 0.17 also formats code blocks in Markdown; the research records are prose and partly hash-frozen
# (validation/document_hashes.txt), so Markdown is never rewritten.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pyright]
include = ["src", "tests", "research/benchmarks", "evaluation", "scripts"]
extraPaths = ["src", "."]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
