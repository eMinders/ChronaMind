[project]
name = "chronamind-custom-memory-engine"
version = "0.1.0"
description = "Independent Custom Memory Engine decision contracts and compatibility verification"
requires-python = ">=3.12,<3.13"
dependencies = [
  "psycopg[binary,pool]==3.3.2",
  "pgvector==0.4.2",
  "pydantic==2.12.5",
  "tenacity==9.1.2",
  "structlog==25.5.0",
  "rich==14.3.3",
  "numpy==2.4.2",
  "scipy==1.18.1",
  "ijson==3.6.0",
  "regex==2026.9.29",
]

[project.optional-dependencies]
baselines = [
  "tiktoken==0.14.0",
  "onnxruntime==1.31.0",
  "tokenizers==0.23.3",
  "mem0ai==2.2.1",
  "graphiti-core[falkordb]==0.31.2",
  "qdrant-client==1.20.0",
  "openai==2.7.1",
]

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.6",
  "pyright==1.1.408",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/custom_memory_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = [
  "tests",
  "evaluation/harness/tests",
  "research/benchmarks/longmemeval/tests",
  "research/benchmarks/locomo/tests",
  "research/benchmarks/tests",
  "evaluation/baselines/tests",
  "evaluation/judge/tests",
  "evaluation/stats/tests",
]
markers = ["integration: requires a disposable PostgreSQL database"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pyright]
include = ["src", "tests", "research/benchmarks", "evaluation", "scripts"]
extraPaths = ["src", "."]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
